# Odin1 with manifoldsdk/odin_ros_driver v0.14.4. The campaign's `sensor:` block overrides any of this.
name: Odin

frames:
  # from include/host_sdk_sample.h: odom -> imu (send_odom_baselink_tf), odom -> map (relocalization
  # mode only), imu -> lidar
  odom: odom
  body: imu
  map: map
  # Odin publishes odom->map with parent=odom, child=map (inverse of ROS map->odom).
  # Only set this true if a driver update switches to the ROS convention (parent=map).
  odom_map_is_ros_convention: false
other_frames: [lidar, camera_0]   # never suggested as mocap by find-mocap
namespace: /odin1

# Measured on the sentry Jetson: /odin1/cloud_raw 7.5 MB/s (27 GB/h), imu 0.13 MB/s,
# odometry_highfreq 0.29 MB/s. The cloud is recorded only for the Phase 0 preflight and outages.
topics:
  imu: /odin1/imu                 # time offset fit; its arrival also shows the driver is up
  odometry: /odin1/odometry
  cloud: /odin1/cloud_raw
  extra: []                       # e.g. /odin1/odometry_highfreq (the analysis uses the odom->imu tf)
qos_overrides: ~/odin_ws/src/odin_ros_driver/script/rosbag2_qos.yaml  # stops 400 Hz IMU drops

connect_timeout_s: 60             # wait this long for the first IMU message after launch
# Thermal warm-up before collecting (protocol: 20 min). Disabled for speed: thermal effects
# (Tier 2) are ignored. Set back to 20 to follow the protocol.
warmup_min: 0

driver:
  # The installed control_command.yaml. odin_ros_driver ignores any config path you pass it and
  # always reads this file, so each run's config (original + overrides + map mode) is written into
  # it. The original is backed up as control_command.yaml.odin_char_original and restored when the
  # campaign exits; every run's config is also archived in <campaign>/logs/.
  base_config: ~/odin_ws/src/odin_ros_driver/config/control_command.yaml
  # Run the driver node directly (the launch file also starts rviz and demo nodes).
  run_cmd: "ros2 run odin_ros_driver host_sdk_sample --ros-args -p config_file:={config}"
  process_name: host_sdk_sample
  save_map_service: /odin1/save_map            # odin_ros_driver/srv/SaveMap {value: 1}
  map_saved_text: "Map transfer completed"
  relocalization_success_text: "relocalization success!"
  calib_yaml: ~/.ros/odin_ros_driver/calib.yaml  # written by the driver; first line = serial
  overrides:                  # applied to the copied config for every run
    use_host_ros_time: 2      # Odin time aligned to the host clock (protocol Phase 0)
    devstatuslog: 1
    sendodom: 1
    send_odom_baselink_tf: 1
    sendimu: 1
    senddtof: 1               # raw cloud (Phase 0 preflight, outage timing)
    # Off: with these on, the sentry Jetson's driver dropped ODOMETRY / TF_ODOM queue entries
    # ("Queue ... is full", 2026-10-03), which would show up as fake latency and gaps. None of
    # them are used by the analysis.
    sendrgb: 0
    sendrgbcompressed: 0
    sendrgbundistort: 0
    sendcloudslam: 0
    sendcloudrender: 0
    senddepth: 0
    sendreprojection: 0
    sendoverlay: 0
