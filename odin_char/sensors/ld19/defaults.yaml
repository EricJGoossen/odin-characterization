# LDROBOT LD19 (sold by WayPonDEV as FHL-LD19): 2D DTOF lidar, 360 deg, ~10 Hz, 0.02-12 m.
# Override any of this with `python -m odin_char.sensors.ld19 --config my.yaml ...`.
name: LD19

frame: base_laser                 # everything (odometry, SLAM) runs in the lidar frame: no robot model needed
scan_topic: /scan
odom_topic: /odom_rf2o
map_topic: /map

# Driver: github.com/ldrobotSensorTeam/ldlidar_stl_ros2. {params} is a params file written per run from
# `driver_params` below.
driver_cmd: "ros2 run ldlidar_stl_ros2 ldlidar_stl_ros2_node --ros-args --params-file {params}"
driver_process: ldlidar_stl_ros2_node   # refuse to start next to a driver started by hand
driver_params:
  product_name: LDLiDAR_LD19
  topic_name: scan
  frame_id: base_laser
  port_name: /dev/ttyUSB0         # VERIFY: the LD19's USB-serial adapter
  port_baudrate: 230400
  laser_scan_dir: true            # true: counterclockwise angles (ROS convention)
  enable_angle_crop_func: false   # true + angle_crop_min/max (deg) to blank a part of the circle, e.g. the robot's own frame
  angle_crop_min: 135.0
  angle_crop_max: 225.0

# Live map (the `map` step): scan-matching odometry (no wheels, no IMU) + SLAM.
odometry_cmd: "ros2 run rf2o_laser_odometry rf2o_laser_odometry_node --ros-args --params-file {params}"
odometry_params:
  laser_scan_topic: /scan
  odom_topic: /odom_rf2o
  publish_tf: true
  base_frame_id: base_laser
  odom_frame_id: odom
  init_pose_from_topic: ""
  freq: 20.0
slam_cmd: "ros2 launch slam_toolbox online_async_launch.py slam_params_file:={params} use_sim_time:=false"
slam_params:
  odom_frame: odom
  map_frame: map
  base_frame: base_laser
  scan_topic: /scan
  mode: mapping
  resolution: 0.05
  max_laser_range: 12.0
  minimum_travel_distance: 0.1    # m between scans added to the map
  minimum_travel_heading: 0.1     # rad
  map_update_interval: 1.0        # s: how often /map is republished (the live view)
  transform_publish_period: 0.02
  use_scan_matching: true
  do_loop_closing: true
# live view: rviz2 with odin_char/sensors/ld19/ld19.rviz (map, scan, path). Off on a headless robot
# computer: run `rviz2 -d odin_char/sensors/ld19/ld19.rviz` on a laptop with the same ROS_DOMAIN_ID.
viewer_cmd: "rviz2 -d {rviz}"
save_map_service: /slam_toolbox/serialize_map   # slam_toolbox/srv/SerializePoseGraph, for reuse in localization

connect_timeout_s: 15             # wait this long for the first scan after starting the driver
static_s: 60                      # length of each `static` recording
