# Odin1 Tier 0 characterization campaign configuration.
# Everything marked VERIFY must be checked on the real robot before the first run
# (`python -m odin_char.cli inspect <bag>` lists the topics and tf pairs in a bag).

frames:
  mocap_world: mocap          # VERIFY: parent of the mocap -> base_link transform (ground truth)
  mocap_body: base_link       # the mocap rigid body. Odin rides on turret major, which the MCB
                              # holds at a fixed chassis yaw during the campaign; markers on Odin's
                              # bracket (and mocap_body set to that body) are better still.
  # mocap stamps come from the mocap server's clock: each bag is mapped onto the host clock with
  # an offset+drift fit to the arrival times. Use "host" if the mocap driver stamps on arrival.
  mocap_clock: server
  # Odin frames, from odin_ros_driver (include/host_sdk_sample.h, v0.14.4):
  #   odom -> imu  (send_odom_baselink_tf), odom -> map (relocalization mode only), imu -> lidar
  odin_odom: odom
  odin_imu: imu
  odin_map: map
  # Odin publishes odom->map with parent=odom, child=map (inverse of ROS map->odom).
  # Only set this true if a driver update switches to the ROS convention (parent=map).
  odom_map_is_ros_convention: false

topics:
  tf: /tf
  tf_static: /tf_static
  odometry: /odin1/odometry
  odometry_highfreq: /odin1/odometry_highfreq
  imu: /odin1/imu
  cloud: /odin1/cloud_raw
  rosout: /rosout
  markers: null               # optional mocap marker array topic (Phase 0 ghost-marker check)
  mocap_pose: null            # optional PoseStamped alternative to the mocap tf

# --------------------------------------------------------------------------- robot / room
robot:
  bridge_host: 127.0.0.1      # where tools/chassis_velocity_bridge.py (project-otto) runs
  bridge_port: 47020
  control_rate_hz: 50
  max_speed: 1.8              # m/s hard cap in the script (the MCB also caps at 2.5)
  max_accel: 1.5              # m/s^2
  max_yaw_rate: 3.0           # rad/s
  max_yaw_accel: 6.0          # rad/s^2
  mocap_timeout_s: 0.05       # stop if the mocap transform is older than this
  kp_pos: 2.0                 # 1/s   position feedback on mocap
  ki_pos: 0.2
  kp_yaw: 3.0                 # 1/s
  sysid: true                 # identify command -> actual velocity gains from mocap first

room:
  # Geofence in the mocap world frame (m). The robot is stopped (and the phase aborted) if it,
  # or its stopping point, leaves fence minus margin.
  fence_min: [-4.0, -3.0]     # VERIFY
  fence_max: [4.0, 3.0]       # VERIFY
  margin: 0.4
  home: [0.0, 0.0, 0.0]       # x, y, yaw where the robot parks between phases

# --------------------------------------------------------------------------- Odin driver
driver:
  # The deployed control_command.yaml. It is copied per run (into the run folder, which also
  # archives it) with `overrides` and the map settings applied; the installed file is not touched.
  base_config: ~/odin_ws/src/odin_ros_driver/config/control_command.yaml   # VERIFY path
  # Run the driver node directly (the launch file also starts rviz and demo nodes).
  run_cmd: "ros2 run odin_ros_driver host_sdk_sample --ros-args -p config_file:={config}"
  save_map_service: /odin1/save_map            # odin_ros_driver/srv/SaveMap {value: 1}
  map_saved_text: "Map transfer completed"
  relocalization_success_text: "relocalization success!"
  calib_yaml: ~/.ros/odin_ros_driver/calib.yaml  # written by the driver; first line = serial
  qos_overrides: ~/odin_ws/src/odin_ros_driver/script/rosbag2_qos.yaml  # stops 400 Hz IMU drops
  overrides:                  # applied to the copied config for every run
    use_host_ros_time: 2      # Odin time aligned to the host clock (protocol Phase 0)
    devstatuslog: 1
    sendodom: 1
    send_odom_baselink_tf: 1
    sendimu: 1
    senddtof: 1
  connect_timeout_s: 60       # wait this long for the first /odin1/imu message after launch
  warmup_min: 20

# --------------------------------------------------------------------------- phases
phases:
  preflight:
    duration_s: 120
  calib:
    duration_s: 150
  mapping:
    lane_spacing: 1.0
    speed: 0.4
    loops: 2
  phase2:
    center: [0.0, 0.0]        # figure-8 centre in mocap world
    half_length: 3.0          # A: half extent along x
    half_width: 1.8           # B: half extent along y (lobe width)
    rotation_deg: 0.0
    nominal_speed: 0.8        # m/s
    nominal_laps: 10
    sweep_laps: 2
    sweep_factors: [0.5, 1.5]
    operator_spot: "fixed spot by the door, outside the lidar's view"
  phase3:
    locations:                # x, y, yaw in mocap world; pick different geometry
      - [2.5, 1.5, 0.0]
      - [-2.5, 1.5, 1.57]
      - [-2.5, -1.5, 3.14]
      - [2.5, -1.5, -1.57]
    hold_s: 600
  phase4:
    frequencies_hz: [0.5, 1.0, 1.5, 2.0]
    peak_speed: 0.6
    peak_yaw_rate: 1.5
    seconds_per_frequency: 20
  phase5:
    offsets_m: [0.0, 0.5, 1.0, 2.0]
    heading_offsets_deg: [0, 10, 30]
    start_behaviours: [stationary, moving]
    timeout_s: 60
    cover_durations_s: [1, 3, 10]
    cover_repeats: 5
    cover_speed: 0.2
    shutter_cmd_cover: null   # optional automatic occluder, e.g. "ros2 topic pub --once /shutter std_msgs/Bool '{data: true}'"
    shutter_cmd_uncover: null

# --------------------------------------------------------------------------- analysis
analysis:
  consumer_rate_hz: 10
  latency_reference: stamp    # stamp | arrival: match what the sim consumer sees
  static_field_grid_m: 0.35
  static_field_min_samples: 5
  static_field_r2_threshold: 0.5
  # true: keep eps_s only on axes whose held-out R^2 > threshold (a field with negative held-out
  # R^2 only adds noise). false: literal reading of the protocol (keep all axes if any passes).
  static_field_per_axis: true
  t_loglik_threshold: 10
  mc_realizations: 200        # protocol: 50+; rank tests across 6 axes need >= 180
  # holdout_session: s3      # default: last session

# Optional: CAD / mount geometry for base_link -> Odin IMU ([tx ty tz rx ry rz], rotation vector).
# Pins directions planar driving cannot observe (e.g. the vertical lever arm).
hand_eye_prior: null
calibration_override: null

preflight:
  wall_roi: null              # [[xmin,ymin,zmin],[xmax,ymax,zmax]] box around a flat wall in Odin's frame
  expected_markers: null
