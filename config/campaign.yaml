# Tier 0 characterization campaign configuration (sensor: see `sensor:` below).
# Everything marked VERIFY must be checked on the real robot before the first run.
#   scripts/run_campaign.sh find-mocap   lists live mocap candidates (topics, tf pairs, rates)
#   python -m odin_char.cli inspect <bag> lists the topics and tf pairs in a recorded bag

# --------------------------------------------------------------------------- mocap (ground truth)
# The mocap system is already running; the campaign only subscribes. Pick ONE source:
#   tf        a transform parent_frame -> child_frame on `topic` (normally /tf)
#   pose      geometry_msgs/PoseStamped on `topic`
#   transform geometry_msgs/TransformStamped on `topic`
#   odometry  nav_msgs/Odometry on `topic`
# The tracked body is the robot's mocap rigid body. The sensor (Odin) rides on turret major, which the
# MCB holds at a fixed chassis yaw during the campaign; a rigid body on the sensor's bracket is better still.
mocap:
  # vrpn_mocap_client_node on the lab network: PoseStamped in frame "world", ~360 Hz, best effort
  # (checked 2026-10-02 with find-mocap; arrival - stamp ~2 ms)
  source: pose
  topic: /vrpn_mocap/ARUW_Sentry/pose
  parent_frame: null          # tf only
  child_frame: null           # tf only
  # server: stamps may come from the mocap server's clock; each bag is mapped onto the host clock
  # with an offset + drift fit to arrival times (harmless when the clocks already agree).
  # host: the mocap driver stamps on arrival (host clock).
  clock: server
  qos: best_effort            # best_effort | reliable (best_effort also hears reliable publishers)

# --------------------------------------------------------------------------- sensor under test
# One folder per sensor type in odin_char/sensors/<type>/; its defaults.yaml holds the frames, topics
# and driver settings. Anything set here overrides those defaults (see odin_char/sensors/README.md).
sensor:
  type: odin
  driver:
    # The installed control_command.yaml. Each run's config is written into it and the original is
    # restored when the campaign exits (details in odin_char/sensors/odin/defaults.yaml).
    base_config: ~/odin_ws/src/odin_ros_driver/config/control_command.yaml   # VERIFY path
  # Thermal warm-up before collecting (protocol: 20 min). Disabled for speed: thermal effects
  # (Tier 2) are ignored. Set back to 20 to follow the protocol.
  warmup_min: 0

topics:                       # recorded with every run, whatever the sensor
  tf: /tf
  tf_static: /tf_static
  rosout: /rosout
  markers: null               # optional mocap marker array topic (Phase 0 ghost-marker check)
# --------------------------------------------------------------------------- recording
recording:
  min_free_gb: 2.0            # a recording refuses to start below this
  cloud_in_outages: true      # refine cover/uncover times from the cloud (Odin: ~0.45 GB per minute, ~5 GB total)

# --------------------------------------------------------------------------- robot / room
robot:
  # human: a person drives with the remote; the script guides, records and runs the sensor (no commands
  #        are sent, no otto mode or MCB branch needed). autonomous: the script drives over
  #        otto's odin-characterization mode (needs a working Jetson <-> MCB link). The settings
  #        below this line are only used in autonomous mode.
  control: human
  bridge_host: 127.0.0.1      # where tools/chassis_velocity_bridge.py (project-otto) runs
  bridge_port: 47020
  control_rate_hz: 50
  max_speed: 1.8              # m/s hard cap in the script (the MCB also caps at 2.5)
  max_accel: 1.5              # m/s^2
  max_yaw_rate: 3.0           # rad/s
  max_yaw_accel: 6.0          # rad/s^2
  mocap_timeout_s: 0.05       # stop if the mocap transform is older than this
  kp_pos: 2.0                 # 1/s   position feedback on mocap
  ki_pos: 0.2
  kp_yaw: 3.0                 # 1/s
  sysid: true                 # identify command -> actual velocity gains from mocap first

room:
  # Geofence in the mocap world frame (m). The robot is stopped (and the phase aborted) if it,
  # or its stopping point, leaves fence minus margin.
  fence_min: [-4.0, -3.0]     # VERIFY
  fence_max: [4.0, 3.0]       # VERIFY
  margin: 0.4
  home: [0.0, 0.0, 0.0]       # x, y, yaw where the robot parks between phases

# --------------------------------------------------------------------------- phases
phases:
  preflight:
    duration_s: 120
  calib:
    duration_s: 150
  mapping:
    lane_spacing: 1.0
    speed: 0.4
    loops: 2
  phase2:
    center: [0.0, 0.0]        # figure-8 centre in mocap world
    half_length: 3.0          # A: half extent along x
    half_width: 1.8           # B: half extent along y (lobe width)
    rotation_deg: 0.0
    nominal_speed: 0.8        # m/s
    nominal_laps: 10
    validation_laps: 5        # `validation` step: a short extra run held out for Phase 6
    sweep_laps: 2
    sweep_factors: [0.5, 1.5]
    operator_spot: "fixed spot by the door, outside the lidar's view"
  phase3:
    locations:                # x, y, yaw in mocap world; pick different geometry
      - [2.5, 1.5, 0.0]
      - [-2.5, 1.5, 1.57]
      - [-2.5, -1.5, 3.14]
      - [2.5, -1.5, -1.57]
    hold_s: 600
  phase4:
    frequencies_hz: [0.5, 1.0, 1.5, 2.0]
    peak_speed: 0.6
    peak_yaw_rate: 1.5
    seconds_per_frequency: 20
  phase5:
    offsets_m: [0.0, 0.5, 1.0, 2.0]
    heading_offsets_deg: [0, 10, 30]
    start_behaviours: [stationary, moving]
    timeout_s: 60
    cover_durations_s: [1, 3, 10]
    cover_repeats: 5
    cover_speed: 0.2
    shutter_cmd_cover: null   # optional automatic occluder, e.g. "ros2 topic pub --once /shutter std_msgs/Bool '{data: true}'"
    shutter_cmd_uncover: null

# --------------------------------------------------------------------------- analysis
analysis:
  consumer_rate_hz: 10
  latency_reference: stamp    # stamp | arrival: match what the sim consumer sees
  static_field_grid_m: 0.35
  static_field_min_samples: 5
  static_field_r2_threshold: 0.5
  # true: keep eps_s only on axes whose held-out R^2 > threshold (a field with negative held-out
  # R^2 only adds noise). false: literal reading of the protocol (keep all axes if any passes).
  static_field_per_axis: true
  t_loglik_threshold: 10
  mc_realizations: 200        # protocol: 50+; rank tests across 6 axes need >= 180
  # holdout_session: s3      # default: last session
  # zero-phase low-pass on the mocap truth (Hz; null = off). A 10 Hz sensor output cannot follow
  # anything above 5 Hz, and the sentry's marker body vibrates at ~8 Hz with the motors on.
  truth_lowpass_hz: 4.0
  # one constant map-frame offset per relocalization (Odin sets odom->map when it relocalizes
  # and then barely corrects it); removed before the FOGM / static-field fits and simulated as
  # b ~ N(0, sigma_b^2) per relocalization
  registration_term: true

# Optional: CAD / mount geometry for base_link -> sensor body frame ([tx ty tz rx ry rz], rotation vector).
# Pins directions planar driving cannot observe (e.g. the vertical lever arm).
hand_eye_prior: null
calibration_override: null

preflight:
  wall_roi: null              # [[xmin,ymin,zmin],[xmax,ymax,zmax]] box around a flat wall in the sensor's frame
  expected_markers: null
